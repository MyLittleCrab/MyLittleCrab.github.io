<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Из мтаврули в мхедрули</title>
    <style>
        :root{
            --bg1: #0f172a;
            --bg2: #0b2545;
            --card: rgba(255,255,255,0.04);
            --accent: #60a5fa;
            --glass: rgba(255,255,255,0.03);
            --text: #e6eef8;
            --muted: #b7c7e6;
            --radius: 12px;
        }
        html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);-webkit-font-smoothing:antialiased}
        .wrap{
            max-width:1100px;
            margin:40px auto;
            padding:28px;
            background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border-radius:var(--radius);
            box-shadow: 0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.04);
        }
        header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
        header h1{font-size:20px;margin:0}
        header p{margin:0;color:var(--muted);font-size:13px}
        .panes{
            display:flex;
            gap:18px;
            align-items:stretch;
        }
        .pane{
            flex:1;
            display:flex;
            flex-direction:column;
            background:var(--card);
            padding:12px;
            border-radius:10px;
            min-height:260px;
            border:1px solid rgba(255,255,255,0.02);
        }
        label{font-size:13px;color:var(--muted);margin-bottom:8px;display:block}
        textarea{
            flex:1;
            resize:vertical;
            min-height:160px;
            max-height:500px;
            background:transparent;
            border:1px dashed rgba(255,255,255,0.04);
            border-radius:8px;
            padding:12px;
            color:var(--text);
            font-size:15px;
            line-height:1.5;
            outline:none;
        }
        .actions{
            margin-top:14px;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            flex-wrap:wrap;
        }
        .btn{
            background:linear-gradient(180deg,var(--accent),#3b82f6);
            color:white;
            padding:10px 18px;
            border-radius:10px;
            border:0;
            cursor:pointer;
            font-weight:600;
            box-shadow: 0 6px 18px rgba(59,130,246,0.18);
        }
        .btn.secondary{
            background:transparent;
            border:1px solid rgba(255,255,255,0.06);
            color:var(--muted);
            box-shadow:none;
        }
        .note{margin-top:12px;color:var(--muted);font-size:13px;text-align:center}
        @media (max-width:860px){
            .panes{flex-direction:column}
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div>
                <h1>Mtavruli → Mkhedruli</h1>
                <p>Вставьте текст в левое поле и нажмите "конвертировать".</p>
            </div>
            <div style="text-align:right;color:var(--muted);font-size:13px">Поддерживается Unicode toLowerCase()</div>
        </header>

        <div class="panes">
            <div class="pane">
                <label for="input">Исходный (mtavruli)</label>
                <textarea id="input" placeholder="Вставьте mtavruli здесь..."></textarea>
                <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
                    <button id="pasteBtn" class="btn secondary" title="Вставить из буфера обмена">Вставить</button>
                    <button id="clearIn" class="btn secondary" title="Очистить поле">Очистить</button>
                </div>
            </div>

            <div class="pane">
                <label for="output">Результат (mkhedruli)</label>
                <textarea id="output" placeholder="Результат будет здесь..." readonly></textarea>
                <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
                    <button id="copyBtn" class="btn secondary" title="Скопировать в буфер обмена">Копировать</button>
                    <button id="clearOut" class="btn secondary" title="Очистить поле">Очистить</button>
                </div>
            </div>
        </div>

        <div class="actions">
            <button id="convertBtn" class="btn">Конвертировать</button>
        </div>

        <div class="note">Подсказка: можно нажать Ctrl+Enter в поле ввода для быстрого конвертирования.</div>
    </div>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const convertBtn = document.getElementById('convertBtn');
        const copyBtn = document.getElementById('copyBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const clearIn = document.getElementById('clearIn');
        const clearOut = document.getElementById('clearOut');

        function convertText(text){
            // Простая конвертация: Unicode toLowerCase() — подходит для большинства mtavruli→mkhedruli
            return String(text || '').normalize('NFC').toLowerCase();
        }

        convertBtn.addEventListener('click', ()=> {
            output.value = convertText(input.value);
        });

        input.addEventListener('keydown', (e)=>{
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                convertBtn.click();
            }
        });

        copyBtn.addEventListener('click', async ()=> {
            try{
                await navigator.clipboard.writeText(output.value || '');
            }catch(e){
                // fallback
                output.select();
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
            }
        });

        pasteBtn.addEventListener('click', async ()=>{
            try{
                const text = await navigator.clipboard.readText();
                input.value = text;
            }catch(e){
                alert('Не удалось получить текст из буфера обмена.');
            }
        });

        clearIn.addEventListener('click', ()=> input.value = '');
        clearOut.addEventListener('click', ()=> output.value = '');
    </script>
</body>
</html>
