<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {

                if (cordova) {
                    alert(JSON.stringify(cordova));

                    if (cordova.exec) {
                        alert(JSON.stringify(cordova.exec));

                        cordova.exec(function (oData) {
                            alert(JSON.stringify(oData));
                        }, function (oError) {
                            alert(oError);
                        }, "ChainwayScannerPlugin", "startUHFScan", []);



                    } else {
                        alert("cordova exec not found")
                    }
                } else {
                    alert("cordova not found");
                }




            }, 2000);

        });
    </script>
</body>

</html>
